name: iPhone validation

on:
  push:
    branches: [main, 'codex/**', validation/iphone]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/validation/iphone' }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Domain, storage, and logger tests
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test.sh

  iphone:
    name: ${{ matrix.device }} · ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/validation/iphone') && 'full suite' || 'workout checks' }}
    runs-on: macos-15
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/validation/iphone') && 240 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone 16', 'iPhone 13 mini']
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      SENDA_SIMULATOR_NAME: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build and run iPhone UI tests
        env:
          SENDA_TEST_RESULTS: ${{ runner.temp }}/senda-results
          FULL_SUITE: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/validation/iphone' }}
        run: |
          if [[ "$FULL_SUITE" == true ]]; then
            bash scripts/test-ios.sh
          else
            bash scripts/test-ios.sh \
              -only-testing:SendaUITests/LoggerUITests/testBlankJournalLaunchIsResponsive \
              -only-testing:SendaUITests/LoggerUITests/testNextFocusesRepsWithoutAnotherTapAndDoneDismissesKeyboard \
              -only-testing:SendaUITests/LoggerUITests/testNextSetReusesBlankRowAndLastValuesSaveImmediately \
              -only-testing:SendaUITests/LoggerUITests/testWorkoutCarouselDotsStayVisibleWhenSelectingAndEditing \
              -only-testing:SendaUITests/LoggerUITests/testWorkoutPagesSwipeBothWaysAndOpenPickerOnlyAfterLastExercise \
              -only-testing:SendaUITests/LoggerUITests/testBackupSettingsExposeExportAndValidatedRestoreActions
          fi
      - name: Preserve simulator results and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-results-${{ matrix.device }}
          path: ${{ runner.temp }}/senda-results/Senda.xcresult
          if-no-files-found: ignore
          retention-days: 7
